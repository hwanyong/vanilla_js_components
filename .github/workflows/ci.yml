name: CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js for GitHub
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@hwanyong'

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Check bundle size
        run: pnpm run check-bundle-size

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Deploy Storybook to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./storybook-static
          enable_jekyll: false
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      # ── Cloudflare Workers (lab.hwanyong.com) ──────────────────────────
      # GitHub Pages 와 ★함께★ 나간다. 위 gh-pages 배포는 그대로 두고 같은
      # 산출물을 lab 쪽으로도 보낸다 — 런칭 전까지 두 자리가 모두 살아 있어야 한다.
      # ★ 선행 조건: 저장소 시크릿 CLOUDFLARE_API_TOKEN · CLOUDFLARE_ACCOUNT_ID.
      - name: Arrange assets under the served path
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p out/vanilla_js_components
          cp -R storybook-static/. out/vanilla_js_components/
          cp cloudflare/_headers out/_headers
          echo "--- 25 MiB 초과로 제외되는 자산:"
          find out -type f -size +25M -print -delete

      # ★ wrangler 4.x 는 Node 22 이상을 요구한다. 이 잡은 위에서 Node 20 으로
      #   맞춰 두었고(Storybook 빌드·npm publish 가 그 버전을 쓴다), 그대로 두면
      #   "Wrangler requires at least Node.js v22" 로 죽는다. 배포 스텝 앞에서만
      #   올리고 기존 빌드는 건드리지 않는다 — 뒤의 publish 스텝이 자기 버전을
      #   다시 지정하므로 여기 올린 값이 그쪽으로 새지 않는다.
      - name: Setup Node.js for Wrangler
        if: github.ref == 'refs/heads/main'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy to Cloudflare
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Setup Node.js for NPM
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          scope: '@uhd_kr'

      - name: Publish to NPM
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm run release:npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Setup Node.js for GitHub Packages
        if: github.ref == 'refs/heads/main'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@hwanyong'

      - name: Publish to GitHub Packages
        if: github.ref == 'refs/heads/main'
        run: pnpm run release:github
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}