name: CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

# ★ 2026-08-25 에 셋을 걷었다. contents: write · pages: write · id-token: write 는
#   gh-pages 브랜치로 Storybook 을 밀던 스텝의 것이었고 그 스텝을 지웠다.
#   packages: write 만 남는다 — 태그 푸시 때 GitHub Packages 로 게시한다.
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js for GitHub
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@hwanyong'

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Check bundle size
        run: pnpm run check-bundle-size

      - name: Build Storybook
        run: pnpm build-storybook

      # ── Cloudflare Workers (lab.hwanyong.com) ──────────────────────────
      # ★이 배포가 유일하다.★
      #
      # ★ 한때 위에 gh-pages 브랜치로 Storybook 을 미는 스텝이 하나 더 있었다.
      #   blog.hwanyong.com 은 이제 Cloudflare 가 서빙하고 옛 경로는 Worker 가
      #   lab 으로 301 하므로, 그 브랜치를 읽는 곳이 없어져 2026-08-25 에 지웠다.
      #   (gh-pages 브랜치 자체는 남아 있다 — 지우면 Pages 가 내려간다.)
      #
      # ★ 선행 조건: 저장소 시크릿 CLOUDFLARE_API_TOKEN · CLOUDFLARE_ACCOUNT_ID.
      - name: Arrange assets under the served path
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p out/vanilla_js_components
          cp -R storybook-static/. out/vanilla_js_components/
          cp cloudflare/_headers out/_headers
          # ★ _redirects 도 함께 올린다. html_handling="none" 이라 디렉터리 색인이
          #   자동으로 잡히지 않고, 이 파일의 200 재작성이 그것을 잇는다.
          #   빠뜨리면 /<repo>/ 가 404 가 된다(실제로 그렇게 나갔다).
          cp cloudflare/_redirects out/_redirects
          echo "--- 25 MiB 초과로 제외되는 자산:"
          find out -type f -size +25M -print -delete

      # ★ wrangler 4.x 는 Node 22 이상을 요구한다. 이 잡은 위에서 Node 20 으로
      #   맞춰 두었고(Storybook 빌드·npm publish 가 그 버전을 쓴다), 그대로 두면
      #   "Wrangler requires at least Node.js v22" 로 죽는다. 배포 스텝 앞에서만
      #   올리고 기존 빌드는 건드리지 않는다 — 뒤의 publish 스텝이 자기 버전을
      #   다시 지정하므로 여기 올린 값이 그쪽으로 새지 않는다.
      - name: Setup Node.js for Wrangler
        if: github.ref == 'refs/heads/main'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy to Cloudflare
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Setup Node.js for NPM
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          scope: '@uhd_kr'

      - name: Publish to NPM
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm run release:npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ★ NPM 쪽과 같은 조건(태그 푸시)이다. 예전에는 main 푸시마다 게시를 시도했는데,
      #   package.json 의 버전은 태그를 달 때만 오르므로 그 사이의 모든 푸시가
      #   409 Conflict("Cannot publish over existing version") 로 죽었다.
      #   릴리스는 태그에서 나온다는 이 저장소의 규칙을 두 게시처가 함께 따른다.
      - name: Setup Node.js for GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@hwanyong'

      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm run release:github
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}